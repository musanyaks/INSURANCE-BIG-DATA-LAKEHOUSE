name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn statsmodels fastapi "httpx" \
                      pyarrow pyyaml joblib plotly uvicorn pytest ruff

      - name: Lint
        run: ruff check .

      - name: Seed data
        run: python -m ingestion.synthetic.generator --scale seed

      - name: Tests
        run: pytest -q
