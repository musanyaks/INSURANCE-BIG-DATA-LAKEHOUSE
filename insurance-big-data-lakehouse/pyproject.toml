[project]
name = "insurance-big-data-lakehouse"
version = "1.0.0"
description = "End-to-end insurance data lakehouse: Kafka streaming, Spark medallion architecture, Delta Lake, actuarial analytics, ML and governance on an OSS stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meridian Mutual (demo)" }]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",  # long lines allowed in SQL/labels/comments
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "B905",  # zip(strict=) not required everywhere
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
