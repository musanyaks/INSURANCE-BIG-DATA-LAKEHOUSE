# Trino catalog over the lakehouse bucket on MinIO.
# Mounted to /etc/trino/catalog/lakehouse.properties by docker-compose.
#   docker compose --profile query up -d trino
#   docker exec -it lakehouse-trino trino  →  show tables from lakehouse.gold;
connector.name=hive
hive.metastore=file
hive.metastore.file.dir=/data/trino-metastore

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.path-style-access=true

# Parquet / Delta writer compatibility
hive.parquet.use-column-names=true
