# Nightly gold-mart rebuild as a Kubernetes CronJob (spark-submit).
# Replace the image and s3 settings with your Spark runtime of choice
# (EMR on EKS, Spark Operator, Databricks job clusters, …).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gold-mart-rebuild
  namespace: insurance-lakehouse
spec:
  schedule: "30 2 * * *"          # 02:30 UTC nightly
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: spark-gold
              image: ghcr.io/meridian/lakehouse-spark:latest  # build from Dockerfile.spark
              command: ["spark-submit", "--master", "local[*]",
                        "/opt/app/spark/gold/gold_portfolio_kpis.py"]
              env:
                - name: LAKEHOUSE_ROOT
                  value: s3a://lakehouse
                - name: DELTA_ENABLED
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: object-store, key: access-key } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: object-store, key: secret-key } }
                - name: S3_ENDPOINT
                  value: http://minio.insurance-lakehouse.svc:9000
          # For real clusters swap local[*] for your resource manager,
          # e.g. k8s://https://$KUBERNETES_SERVICE_HOST:443 with executor pods.
