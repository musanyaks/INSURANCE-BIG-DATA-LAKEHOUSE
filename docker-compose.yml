# ═══════════════════════════════════════════════════════════════════════════
#  Insurance Big-Data Lakehouse — local OSS stack
#  core:    kafka, minio, postgres, api, dashboard
#  query:   trino              → docker compose --profile query up -d
#  spark:   spark job runner   → docker compose --profile spark up -d
#  tools:   kafka-ui           → docker compose --profile tools up -d
# ═══════════════════════════════════════════════════════════════════════════
name: insurance-lakehouse

services:
  # ── Ingestion ────────────────────────────────────────────────────────────
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: lakehouse-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "3"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lakehouse-kafka-ui
    profiles: ["tools"]
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: meridian
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ── Storage ───────────────────────────────────────────────────────────────
  minio:
    image: bitnamilegacy/minio:latest
    container_name: lakehouse-minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: lakehouse
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/lakehouse &&
      echo 'bucket lakehouse ready'"

  postgres:
    image: postgres:16-alpine
    container_name: lakehouse-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev}
      POSTGRES_DB: ${POSTGRES_DB:-meridian_policy}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./ingestion/database/ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Query engine (SQL over the lakehouse on MinIO) ────────────────────────
  trino:
    image: trinodb/trino:latest
    container_name: lakehouse-trino
    profiles: ["query"]
    ports: ["8080:8080"]
    volumes:
      - ./infrastructure/trino/lakehouse.properties:/etc/trino/catalog/lakehouse.properties:ro

  # ── Compute (spark-submit wrapper; jobs live in ./spark) ──────────────────
  spark:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.spark
    container_name: lakehouse-spark
    profiles: ["spark"]
    environment: &lakehouse_env
      LAKEHOUSE_ROOT: s3a://lakehouse
      DELTA_ENABLED: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      minio: { condition: service_healthy }
    command: sleep infinity

  # ── Serving ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: lakehouse-api
    ports: ["8000:8000"]
    environment:
      <<: *lakehouse_env
      # empty → quantile-based top-10% review queue (see common/config.py)
      FRAUD_ALERT_THRESHOLD: ${FRAUD_ALERT_THRESHOLD:-}
    depends_on:
      minio: { condition: service_healthy }

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: lakehouse-dashboard
    ports: ["8501:8501"]
    environment:
      <<: *lakehouse_env
    depends_on:
      minio: { condition: service_healthy }

volumes:
  kafka-data:
  minio-data:
  pg-data:
