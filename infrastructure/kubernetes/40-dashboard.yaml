# Streamlit executive dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-dashboard
  namespace: insurance-lakehouse
spec:
  replicas: 1
  selector: { matchLabels: { app: lakehouse-dashboard } }
  template:
    metadata: { labels: { app: lakehouse-dashboard } }
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/meridian/lakehouse-dashboard:latest   # build from infrastructure/docker/Dockerfile.dashboard
          ports: [{ containerPort: 8501 }]
          env:
            - name: LAKEHOUSE_ROOT
              value: s3a://lakehouse
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: object-store, key: access-key } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-store, key: secret-key } }
            - name: S3_ENDPOINT
              value: http://minio.insurance-lakehouse.svc:9000
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: lakehouse-dashboard
  namespace: insurance-lakehouse
spec:
  selector: { app: lakehouse-dashboard }
  ports: [{ port: 80, targetPort: 8501 }]
